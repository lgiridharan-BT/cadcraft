name: BridgeTower Windows build

# Every push to main: run the engine tests, build a self-contained cadcraft.exe and publish it
# as the "bridgetower-latest" release, so any PC can download it without Rust or a build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bt-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      # Static C runtime: the exe runs on a PC without the Visual C++ redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
      # Shown in Help > About, so anyone can tell which build a laptop has.
      BT_BUILD: "#${{ github.run_number }} (${{ github.sha }})"
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Engine tests (Z / ID and the main suite)
        run: cargo test --release -p cadcraft-engine --test it --test bt_pdf_and_prompts

      - name: PDF reader tests
        run: cargo test --release -p cadcraft-io --lib pdf_read

      - name: Build cadcraft.exe
        run: cargo build --release -p cadcraft -p cadcraft-cli

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\cadcraft.exe, target\release\cadcraft-cli.exe dist\
          Copy-Item README.md, LICENSE-APACHE, LICENSE-MIT, NOTICE, ATTRIBUTION.md, BRIDGETOWER-CHANGES.md dist\
          Copy-Item docs\brand\LICENSE-brand.txt dist\ARTCRAFT-BRAND-TERMS.txt
          Compress-Archive -Path dist\* -DestinationPath cadcraft-windows-x64.zip -Force
          Get-FileHash dist\cadcraft.exe -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: cadcraft-windows-x64
          path: cadcraft-windows-x64.zip

      - name: Publish release "bridgetower-latest"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # Update the one rolling release in place rather than delete-and-recreate (the delete can
        # fail or lag, and then the create collides with "release already exists"). Order:
        # point the tag at this commit, then replace the assets (or create the release if it is
        # missing), then refresh the title and notes. Any failing gh call fails the step.
        run: |
          $tag   = "bridgetower-latest"
          $repo  = $env:GITHUB_REPOSITORY
          $sha   = $env:GITHUB_SHA
          $title = "CADCraft (BridgeTower build) $($sha.Substring(0,7))"
          $notes = "BridgeTower GP build of CADCraft (https://github.com/storytold/cadcraft), build #$env:GITHUB_RUN_NUMBER from $sha. Not an official CADCraft or ArtCraft release. MIT OR Apache-2.0: the licence and notice files are in the zip and attached here; changes are in BRIDGETOWER-CHANGES.md. Download cadcraft.exe (or the zip) and run it; no install needed."
          $files = @("cadcraft-windows-x64.zip", "dist\cadcraft.exe", "dist\NOTICE", "dist\LICENSE-MIT", "dist\LICENSE-APACHE")
          function Check($what) { if ($LASTEXITCODE -ne 0) { throw "$what failed (exit $LASTEXITCODE)" } }

          # 1. Tag -> this commit (move it if it exists, create it if not).
          gh api "repos/$repo/git/ref/tags/$tag" --silent 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh api -X PATCH "repos/$repo/git/refs/tags/$tag" -f sha=$sha -F force=true --silent; Check "moving tag $tag"
          } else {
            gh api -X POST "repos/$repo/git/refs" -f ref="refs/tags/$tag" -f sha=$sha --silent; Check "creating tag $tag"
          }

          # 2. Release: replace the assets if it exists, otherwise create it on the tag.
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber; Check "uploading assets"
            gh release edit $tag --title $title --notes $notes --latest; Check "editing release"
          } else {
            gh release create $tag @files --verify-tag --title $title --notes $notes --latest; Check "creating release"
          }
          gh release view $tag --json tagName,name,assets --jq '.name + "  ->  " + ([.assets[].name] | join(", "))'
          $global:LASTEXITCODE = 0
